const PAL=['#f3d77a','#d4af37','#b8921f','#8a6d14','#e8c35a','#c9a227','#a8841a','#7a5f10'];
function bars(v,lb){const mx=Math.max(...v,.001),w=300/v.length;return`<svg viewBox="0 0 300 110" style="width:100%;direction:ltr">${v.map((y,i)=>`<rect x="${i*w+1}" y="${90-y/mx*85}" width="${w-2}" height="${Math.max(1,y/mx*85)}" rx="2" fill="#d4af37"/>${lb&&lb[i]?`<text x="${i*w+w/2}" y="106" font-size="7" fill="#9a917a" text-anchor="middle">${esc(lb[i])}</text>`:''}`).join('')}</svg>`}
function pie(d){const tot=d.reduce((a,x)=>a+x[1],0);if(!tot)return t('nodata');let o=0;const C=2*Math.PI*40;return`<div class="r"><svg viewBox="0 0 100 100" style="width:140px;flex:none;transform:rotate(-90deg)">${d.map((x,i)=>{const l=x[1]/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${PAL[i%8]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</svg><div>${d.map((x,i)=>`<div class="m"><span style="color:${PAL[i%8]}">●</span> ${esc(x[0])} ${hm(x[1])} (${fd(Math.round(x[1]/tot*100))}%)</div>`).join('')}</div></div>`}
function trz(){const a=S.exams;if(!a.length)return t('nodata');const X=i=>a.length>1?10+i/(a.length-1)*280:150,ln=(v,c)=>{const mn=Math.min(...v),r=Math.max(...v)-mn||1,Y=y=>85-(y-mn)/r*70;return`<polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((y,i)=>X(i)+','+Y(y)).join(' ')}"/>`+v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="3" fill="${c}"/>`).join('')};return`<svg viewBox="0 0 300 110" style="width:100%;direction:ltr">${ln(a.map(pc),'#f3d77a')}${ln(a.map(tz),'#7ec8e3')}${a.map((e,i)=>`<text x="${X(i)}" y="106" font-size="7" fill="#9a917a" text-anchor="middle">${esc((e.n||'').slice(0,8))}</text>`).join('')}</svg><div class="m"><span style="color:#f3d77a">●</span> ${t('pct')} <span style="color:#7ec8e3">●</span> ${t('tarz')}</div>`}

return`<div class="c"><h2>${t('trz')}</h2>${trz()}</div><div class="c"><h2>${t('bysub')}</h2>${pie(d)}</div><div class="c"><h2>${t('monthly')}</h2>${bars(mo,mo.map((_,i)=>i%5==0?back(29-i).slice(8):''))}</div><div class="c"><h2>${t('weekly')}</h2>${bars(wk,['-3','-2','-1',t('today')])}<div class="m">${wk.map(x=>fd(x.toFixed(1))).join(' · ')} ${t('h')}</div></div><div class="c"><h2>${t('mist')}</h2>${bars(mk,[t('rk'),t('rc'),t('rt')])}<div class="m">${mk.map(fd).join(' · ')}</div></div>`}
