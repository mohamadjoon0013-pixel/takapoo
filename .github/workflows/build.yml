name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web folder
        run: mkdir -p www && cp index.html www/
      - name: Add Android
        run: npx cap add android
      - name: Make icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android
      - name: Configure (Android 9+, permissions)
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 28/' android/variables.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Takapoo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
